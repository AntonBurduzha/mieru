# One pull request a month for every ecosystem, majors included, with no labels.
# Security alerts stay on (Security tab and email), but "Dependabot security updates"
# is off in the repository settings, so an advisory doesn't open its own PR: the next
# monthly PR picks up the fixed version.
# Every merge to main deploys, so this PR is merged by hand after CI passes.
version: 2

multi-ecosystem-groups:
  monthly:
    schedule:
      interval: monthly
    commit-message:
      prefix: build(deps)
    labels: []

updates:
  - package-ecosystem: uv
    directory: /apps/backend
    patterns: ["*"]
    multi-ecosystem-group: monthly
    labels: []

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly
    labels: []

  - package-ecosystem: docker
    directory: /apps/backend
    patterns: ["*"]
    multi-ecosystem-group: monthly
    labels: []
    ignore:
      # Moving to a new Python minor is a project decision (pyproject, CI, image), not a bump
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
