repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --project apps/backend ruff format
        language: system
        types: [python]
        files: ^apps/backend/
      - id: ruff-check
        name: ruff check
        entry: uv run --project apps/backend ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        files: ^apps/backend/
      - id: mypy
        name: mypy
        entry: uv run --directory apps/backend mypy src
        language: system
        types: [python]
        files: ^apps/backend/src/
        pass_filenames: false
