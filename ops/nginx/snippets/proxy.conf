# How every proxied request is passed on. proxy_set_header follows the same
# inheritance rule as add_header, so locations never set their own.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The client IP is the TCP peer nginx saw; whatever the client sent is dropped
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Proto $scheme;

# A refused or slow connection is retried once, on another server of the upstream
proxy_connect_timeout 1s;
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;
