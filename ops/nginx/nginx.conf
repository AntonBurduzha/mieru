worker_processes auto;

# emerg only: runtime lines (even crit TLS handshake errors) print "client: <ip>",
# and no IP may reach a log. Startup and config errors are still emerg.
error_log stderr emerg;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # No $remote_addr, no $http_user_agent, no query string: nothing that identifies a visitor
    log_format privacy '$time_iso8601 $host "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log off;

    # Docker's DNS. Upstream servers marked "resolve" look their names up again every 5 s,
    # so a recreated container is found at its new address without a reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/conf.d/mieru.conf;
}
