name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mieru
          POSTGRES_PASSWORD: mieru
          POSTGRES_DB: mieru
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mieru -d mieru"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.34.13
        env:
          CLICKHOUSE_DB: mieru
          CLICKHOUSE_USER: mieru
          CLICKHOUSE_PASSWORD: mieru
        ports: ["8123:8123"]
        options: --ulimit nofile=262144:262144
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://mieru:mieru@localhost:5432/mieru
      REDIS_URL: redis://localhost:6379/0
      CLICKHOUSE_URL: http://mieru:mieru@localhost:8123/mieru
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job needs git credentials after checkout
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - name: Wait for ClickHouse
        run: curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8123/ping
      - run: uv run pytest --cov=mieru --cov-report=term-missing
  # Every PR builds the image and imports both apps from it, so a broken image fails review
  image:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job needs git credentials after checkout
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/backend/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          push: false
          tags: mieru-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Import smoke test
        run: docker run --rm mieru-app:ci python -c "import mieru.api.app, mieru.ingest.app"

  # A separate job, so only main ever holds a token that can write packages
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io with the job's own GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job needs git credentials after checkout
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Mostly cache hits from the image job; still smoke-tested here, so the
      # image pushed is exactly the one that was imported
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/backend/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          push: false
          # GHCR names in lowercase
          tags: |
            ghcr.io/antonburduzha/mieru-app:${{ github.sha }}
            ghcr.io/antonburduzha/mieru-app:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
      - name: Import smoke test
        run: docker run --rm ghcr.io/antonburduzha/mieru-app:${{ github.sha }} python -c "import mieru.api.app, mieru.ingest.app"
      - name: Push
        run: docker push --all-tags ghcr.io/antonburduzha/mieru-app

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    permissions: {}
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
